<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel | AI Job Board</title>
  <link rel="stylesheet" href="/static/styles.css?v=2" />
</head>
<body>
  <div class="app-shell">
    <header class="hero">
      <div>
        <p class="eyebrow">Company Admin Workspace</p>
        <h1>Manage job listings and application pipeline</h1>
        <p class="hero-copy">Create, edit, and track job postings from one place, then update candidate applications as they move through the hiring flow.</p>
        <div class="hero-actions">
          <a href="/" class="secondary-button" style="text-decoration:none; display:inline-flex; align-items:center; justify-content:center;">Back to Jobs</a>
        </div>
      </div>
    </header>

    <main class="grid-layout">
      <section class="panel card-glow">
        <div class="section-header">
          <h2>Job Listings</h2>
          <span class="badge">Admin</span>
        </div>
        <form id="admin-job-form" class="results">
          <div class="form-row">
            <label for="admin-title">Title</label>
            <input id="admin-title" name="title" type="text" required />
          </div>
          <div class="form-row">
            <label for="admin-company">Company</label>
            <input id="admin-company" name="company" type="text" required />
          </div>
          <div class="form-row">
            <label for="admin-description">Description</label>
            <textarea id="admin-description" name="description" rows="4" required></textarea>
          </div>
          <div class="form-row">
            <label for="admin-skills">Required Skills (comma separated)</label>
            <input id="admin-skills" name="required_skills" type="text" placeholder="Python, FastAPI, SQL" required />
          </div>
          <div class="form-row">
            <label for="admin-experience">Experience Level</label>
            <input id="admin-experience" name="experience_level" type="text" required />
          </div>
          <div class="form-row">
            <label for="admin-location">Location</label>
            <input id="admin-location" name="location" type="text" required />
          </div>
          <div class="form-row">
            <label for="admin-domain">Domain</label>
            <input id="admin-domain" name="domain" type="text" required />
          </div>
          <div class="form-row">
            <label for="admin-status">Status</label>
            <select id="admin-status" name="status">
              <option value="open">Open</option>
              <option value="closed">Closed</option>
            </select>
          </div>
          <div class="form-row">
            <label for="admin-apply-url">Apply URL</label>
            <input id="admin-apply-url" name="apply_url" type="text" />
          </div>
          <div class="button-row">
            <button type="submit" class="primary-button">Save Job</button>
            <button type="button" id="admin-reset" class="tertiary-button">Reset</button>
          </div>
        </form>
        <div id="admin-job-list" class="results"></div>
      </section>

      <section class="panel card-glow">
        <div class="section-header">
          <h2>Applications by Job</h2>
          <span class="badge">Pipeline</span>
        </div>
        <div id="admin-application-list" class="results"></div>
      </section>
    </main>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script src="/static/app.js?v=2"></script>
</body>
</html>
